# Python DDPG/TD3/TQC + C++ CarSim-MPC bridge.
# CarSim and shared MPC settings come from default.ini. Neural-network settings
# (learning rate, critics, batch size, episodes) live in rl_training.ini.
[inherit]
base = default.ini

[rl]
observation_profile = road_preview_joint
# Road preview distance is longitudinal ground speed times this look-ahead, within the bounds.
curvature_preview_s = 2.0
road_preview_min_m = 10
road_preview_max_m = 50
# Four learned actions: Np, Qy, Qpsi, Rdelta. Other MPC weights stay fixed.
align_neutral_to_mpc = true
min_np = 28
max_np = 52
np_step = 1
max_np_change_per_decision = 0
decision_steps = 2
discount_gamma = 0.995967610541
# Five candidates matching the verified existing 500-episode policies.
# Keep exact training-time values; the middle entry is the fixed-MPC zero action.
q_y_values = 8050, 9775, 11500, 14950, 20240
q_psi_values = 1960, 2380, 2800, 5600, 11200
r_delta_values = 7559.9999999999991, 9180, 10800, 12419.999999999998, 14040
weight_action_mode = continuous_weights
policy_action_dims = 3
max_weight_ratio_per_decision = 1.08
penalize_qp_failure = true

[rl_reward]
# Tracking and steering losses are averaged per decision. Failure penalties
# are charged separately per event.
mode = joint_tracking
w_heading = 1.0
w_course = 0.05
heading_scale_rad = 0.035
tracking_v2 = true
squared_lateral_reward = true
reward_scale = 10
ey_scale_m = 0.2
epsi_scale_rad = 0.10
w_y = 1.0
w_peak = 3.0
peak_threshold_m = 0.25
w_lateral_growth = 0.6
lateral_growth_preview_s = 0.25
w_psi = 0.10
w_steer = 0.03
steer_rate_scale_deg_s = 100
w_steer_rate = 0.05
sideslip_threshold_deg = 5
w_sideslip = 0.20
w_horizon = 0
w_np_change = 0.002
w_vy = 0
w_yaw_error = 0
w_weight_change = 0.001
w_weight_deviation = 0
failure_penalty = 100
qp_failure_penalty = 25
incomplete_episode_penalty = 100
