# Python DDPG/TD3/TQC + C++ CarSim-MPC bridge.
# CarSim and shared MPC settings come from default.ini. Neural-network settings
# (learning rate, critics, batch size, episodes) live in rl_training.ini.
[inherit]
base = default.ini

[simulation]
distance_m = reference_end

[carsim]
sync_browser_result = true

[mpc]
# A fixed run with this config uses the same horizon as the neutral action.
np = 28
nc = 8

[weights]
q_y = 9200
q_psi = 2800
r_delta = 13500

[rl]
# Four learned actions: Np, Qy, Qpsi, Rdelta. Other MPC weights stay fixed.
min_np = 10
nominal_np = 28
max_np = 50
np_step = 2
max_np_change_per_decision = 2
decision_steps = 4
discount_gamma = 0.995967610541
# Increasing candidate arrays. The middle entry is used for a zero action.
q_y_values = 4600, 6000, 7500, 9200, 10500, 12000, 13800
q_psi_values = 1400, 1800, 2300, 2800, 3500, 4400, 5600
r_delta_values = 6750, 8500, 11000, 13500, 17000, 21500, 27000
penalize_qp_failure = true

[rl_reward]
# Tracking and steering losses are averaged per decision. Failure penalties
# are charged separately per event.
tracking_v2 = true
squared_lateral_reward = true
reward_scale = 10
ey_scale_m = 0.2
epsi_scale_rad = 0.10
w_y = 2.0
w_peak = 0.5
peak_threshold_m = 0.25
w_psi = 0.20
w_steer = 0.08
steer_rate_scale_deg_s = 100
w_steer_rate = 0.05
sideslip_threshold_deg = 5
w_sideslip = 0.20
w_horizon = 0
w_np_change = 0.002
w_vy = 0
w_yaw_error = 0
w_weight_change = 0.001
w_weight_deviation = 0
failure_penalty = 100
qp_failure_penalty = 25
incomplete_episode_penalty = 100
