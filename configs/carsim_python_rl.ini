# Python DDPG/TD3/TQC + C++ CarSim-MPC bridge.
# Fixed controller settings come from default.ini. Neural-network settings
# (learning rate, critics, batch size, episodes) live in rl_training.ini.
[inherit]
base = default.ini

[constraints]
# Verified with the current CarSim steering system; keep high-speed scheduling.
max_steer_rate_deg_s = 65

[mpc]
nonlinear_tire = true
tire_slope_floor = 0.15
grip_switch_enabled = true
grip_state_only = true
grip_preview_s = 0.8
speed_rate_end_kmh = 95

[rl]
# Four learned actions: Np, Qy, Qpsi, Rdelta. Other MPC weights stay fixed.
min_np = 10
nominal_np = 25
max_np = 40
decision_steps = 4
discount_gamma = 0.995967610541
q_y_min = 60
q_y_max = 166.66666666666666
q_psi_min = 210
q_psi_max = 583.3333333333334
r_delta_min = 245
r_delta_max = 500
penalize_qp_failure = true

[rl_reward]
# C++ scalar reward; src/rl.cpp applies -4*log1p(weighted_loss).
reward_scale = 10
ey_scale_m = 0.2
epsi_scale_rad = 0.10
w_y = 2.0
w_peak = 0.3
peak_threshold_m = 0.30
w_psi = 0.25
w_steer = 0.03
w_steer_rate = 0.04
w_horizon = 0
w_np_change = 0.01
w_vy = 0.04
w_yaw_error = 0.06
w_weight_change = 0.008
w_weight_deviation = 0.005
w_grip_limited = 0.10
failure_penalty = 100
incomplete_episode_penalty = 100
