[inherit]
base = carsim_focus_60_80.ini

[constraints]
# Approximate zero-position road-wheel equivalent of this CarSim driver's
# steering-wheel speed limit; verify when the steering system changes.
max_steer_rate_deg_s = 65

[mpc]
# Preserve a conservative high-speed limit; validate before broader use.
speed_rate_end_kmh = 95

[rl]
# 4 * 0.05 s = 0.2 s. Gamma preserves approximately the previous 1 s horizon.
decision_steps = 4
discount_gamma = 0.995967610541

[rl_reward]
# Track lateral error and peaks while retaining heading and stability penalties.
w_y = 2.0
w_peak = 0.3
w_psi = 0.17
w_steer_rate = 0.04
w_weight_change = 0.008
