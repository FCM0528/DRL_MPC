[inherit]
base = default.ini

[simulation]
output = results/curvature-scheduled-MPC

[mpc]
np = 92
nc = 10
dt_s = 0.02

[horizon_schedule]
# Separate 20 ms curvature-scheduling profile for the 60 km/h, mu = 0.4 case.
short_np = 64
lookahead_s = 0.9
# Maximum previewed lateral acceleration divided by mu*g.
enter_ratio = 1.15
exit_ratio = 0.25
