# Python SB3 training. Values are per policy decision, not per MPC step.
# MPC sample time and gamma are read from configs/carsim_python_rl.ini.
# CLI --episodes, --seed, --eval-frequency and --tqc-drop override one run.
[training]
episodes = 500
seed = 42
eval_frequency = 2000
buffer_size = 100000
learning_starts = 100
batch_size = 256
train_freq = 1
gradient_steps = 1

[ddpg]
actor_learning_rate = 0.0003
critic_learning_rate = 0.0003
tau = 0.005
actor_hidden_layers = 2
actor_hidden_width = 256
critic_hidden_layers = 2
critic_hidden_width = 256
exploration_noise_sigma = 0.15

[td3]
actor_learning_rate = 0.0003
critic_learning_rate = 0.0003
tau = 0.005
actor_hidden_layers = 2
actor_hidden_width = 256
critic_hidden_layers = 2
critic_hidden_width = 256
n_critics = 2
policy_delay = 2
target_policy_noise = 0.2
target_noise_clip = 0.5
exploration_noise_sigma = 0.15

[tqc]
profile = practical
actor_learning_rate = 0.0003
critic_learning_rate = 0.0003
entropy_learning_rate = 0.0003
tau = 0.005
hidden_layers = 2
hidden_width = 256
n_critics = 3
n_quantiles = 25
drop = 2
target_update_interval = 1
entropy_coefficient = auto
target_entropy = auto
