# CarSim closed-loop fixed MPC configuration.
# Units are explicit in key names. Lines beginning # or ; are comments.
# Each run writes an exact effective_config.ini into its results folder.

[experiment]
name = path_tracking

[simulation]
distance_m = reference_end
# Results root; each run creates a unique subdirectory (also with --out).
output = results/LTV-MPC
open_report = true
plant = carsim

[carsim]
simfile = D:\Program Files (x86)\CarSim2024_Date\simfile.sim
solver_dll = D:\Program Files (x86)\CarSim2024.1_Prog\Programs\solvers\carsim_64.dll
sync_browser_result = false
steering_input = road_wheels
steering_left_index = 0
steering_right_index = 1
steering_gain = 57.29577951308232

[mpc]
# Fixed MPC prediction horizon. RL bounds are in carsim_python_rl.ini.
np = 30
nc = 8
dt_s = 0.05
# Spatial standard deviation for the steering feedforward curvature estimate.
reference_curvature_sigma_m = 2.5
# Use a small minimum Jacobian slope near tire saturation.
tire_slope_floor = 0.05
# Effective relaxation lengths near zero slip for the current CarSim tires.
front_relaxation_m = 0.40
rear_relaxation_m = 0.30

[weights]
# Q = diag(lateral error, course error, lateral error rate, yaw-rate error).
# q_vy and q_r keep their historical key names for existing configurations.
q_y = 9200
q_psi = 2800
track_course = true
q_vy = 650
q_r = 150
# Penalize deviation from the curvature-based front-wheel angle.
r_steer = 33000
steer_feedforward = true
# R_delta: penalty on steering increments (different from a hard rate limit)
r_delta = 13500
# Discourage sudden changes and reversals in steering rate.
r_delta_change = 240000
terminal_scale = 1
# Exponential prediction-step error weight from the paper; 0 is uniform.
stage_weight_lambda = 0

[constraints]
# Use the common front-wheel angle range from the CarSim rack kinematics.
# Direct wheel-angle input has no steering actuator slew model.
max_steer_deg = carsim
max_steer_rate_deg_s = none

[solver]
rho = 40000
max_iterations = 10000
primal_tol = 1e-5
dual_tol = 0.002
