# CarSim closed-loop MPC and DDPG configuration.
# Units are explicit in key names. Lines beginning # or ; are comments.
# Each run writes an exact effective_config.ini into its results folder.

[experiment]
name = ddpg_adaptive

[simulation]
distance_m = 160
# Results root; each run creates a unique subdirectory (also with --out).
output = results/ddpg
open_report = true
plant = carsim

[carsim]
simfile = D:\Program Files (x86)\CarSim2024_Date\simfile.sim
solver_dll = D:\Program Files (x86)\CarSim2024.1_Prog\Programs\solvers\carsim_64.dll
sync_browser_result = true
steering_left_index = 0
steering_right_index = 1
steering_gain = 57.29577951308232

[mpc]
# Fixed-mode Np. The DDPG Np action uses independent [rl] bounds/nominal_np.
np = 13
nc = 7
dt_s = 0.05

[weights]
# Q = diag(q_y, q_psi, q_vy, q_r)
q_y = 100
q_psi = 350
q_vy = 0.4
q_r = 8
# R: penalty on (actual steering - curvature-based feedforward steering)^2
r_steer = 10
# R_delta: penalty on steering increments (different from a hard rate limit)
r_delta = 350
terminal_scale = 3

[constraints]
# Front WHEEL steering, not steering-wheel angle. Both units here are degrees.
max_steer_deg = 24.064227395494576
max_steer_rate_deg_s = 37.24225668350351

[solver]
rho = 20000
max_iterations = 2500
primal_tol = 1e-5
dual_tol = 0.002

[rl]
# The default run trains DDPG and opens a report with reward and comparison plots.
# Set fixed for the original MPC-only report, or eval to load a trained policy.
# Training-speed bounds are initial speeds in km/h, not a physical speed limit.
# fixed | train | eval | compare | eval_grid
mode = train
algorithm = ddpg
min_np = 10
max_np = 40
nominal_np = 15
decision_steps = 5
# DDPG outputs these absolute Q/R coefficients. They are independent of [weights].
# Initial ranges match the V14 training weights times its multiplier bounds.
# They are search bounds, not measured optimal controller weights.
q_y_min = 60
q_y_max = 166.66666666666666
q_psi_min = 210
q_psi_max = 583.3333333333334
q_vy_min = 0.24
q_vy_max = 0.6666666666666666
q_r_min = 4.8
q_r_max = 13.333333333333334
r_steer_min = 7
r_steer_max = 14.285714285714286
r_delta_min = 245
r_delta_max = 500
terminal_scale = 3
curvature_preview_s = 1.5
episodes = 200
seed = 42
train_speed_min_kmh = 30
train_speed_max_kmh = 120
train_mu_min = 0.3
train_mu_max = 0.9
model_file = ddpg_policy.txt

[rl_reward]
# Dimensionless scalar loss: normalize errors first, then apply these weights.
reward_scale = 10
ey_scale_m = 0.2
epsi_scale_rad = 0.10
w_y = 0.75
w_peak = 0.20
peak_threshold_m = 0.30
w_psi = 0.25
w_steer = 0.05
w_steer_rate = 0.10
w_horizon = 0.01
w_np_change = 0.02
w_vy = 0.08
w_yaw_error = 0.10
w_weight_change = 0.03
w_weight_deviation = 0.01
w_grip_limited = 0.03
failure_penalty = 100
incomplete_episode_penalty = 100
