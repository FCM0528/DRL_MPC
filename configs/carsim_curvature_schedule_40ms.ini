[inherit]
base = default.ini

[simulation]
output = results/curvature-scheduled-MPC-40ms

[mpc]
dt_s = 0.04
np = 50
nc = 7

[horizon_schedule]
# Select the long horizon before the high-demand section, then hold through recovery.
short_np = 28
lookahead_s = 1.7
enter_ratio = 1.15
exit_ratio = 0.08

[weights]
# Selected jointly with the horizon schedule for the 60 km/h, mu=0.4 case.
q_y = 13800
q_psi = 3500
r_steer = 50000
r_delta = 21500
r_delta_change = 480000
stage_weight_lambda = 0.35
